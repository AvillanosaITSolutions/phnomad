name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Validate SSH configuration
        env:
          VPS_HOST: 88.222.245.88
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          USERNAME="${VPS_USER:-root}"
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "VPS_SSH_KEY secret is empty or missing."
            exit 1
          fi
          echo "Using SSH target ${USERNAME}@${VPS_HOST}:${PORT}"
          ssh-add -l || true

      - name: Validate required app secrets
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          PHILSMS_API_URL: ${{ secrets.PHILSMS_API_URL }}
          PHILSMS_API_TOKEN: ${{ secrets.PHILSMS_API_TOKEN }}
          PHILSMS_SENDER_ID: ${{ secrets.PHILSMS_SENDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY }}
          PAYMONGO_WEBHOOK_AUTH: ${{ secrets.PAYMONGO_WEBHOOK_AUTH }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -e
          missing=0
          for key in \
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB BACKEND_PORT FRONTEND_URL DATABASE_URL JWT_SECRET \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL \
            PHILSMS_API_URL PHILSMS_API_TOKEN PHILSMS_SENDER_ID \
            GMAIL_USER GMAIL_APP_PASSWORD PAYMONGO_SECRET_KEY PAYMONGO_WEBHOOK_AUTH \
            VITE_API_URL VITE_GOOGLE_CLIENT_ID; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. Aborting deploy."
            exit 1
          fi

      - name: Check SSH reachability
        env:
          VPS_HOST: 88.222.245.88
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          timeout 20 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${PORT}" || {
            echo "Cannot reach ${VPS_HOST}:${PORT} from GitHub runner."
            echo "Open the port in VPS cloud firewall/security group and UFW/iptables."
            exit 1
          }

      - name: Sync repository to VPS
        env:
          VPS_HOST: 88.222.245.88
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          USERNAME="${VPS_USER:-root}"
          ssh -p "${PORT}" -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${USERNAME}@${VPS_HOST} "mkdir -p /phnomad"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/dist' \
            --exclude '.env' \
            --exclude '.env.vps' \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=no" \
            ./ "${USERNAME}@${VPS_HOST}:/phnomad/"

      - name: Deploy app stack to VPS
        env:
          VPS_HOST: 88.222.245.88
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          USERNAME="${VPS_USER:-root}"
          ssh -p "${PORT}" -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${USERNAME}@${VPS_HOST} << 'EOF'
            set -e
            APP_DIR="/phnomad"

            echo "Running on host: $(hostname)"
            echo "Current user: $(whoami)"
            echo "App directory: ${APP_DIR}"

            cd "${APP_DIR}"
            test -f docker-compose.yml

            cat > .env << 'ENVEOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            PHILSMS_API_URL=${{ secrets.PHILSMS_API_URL }}
            PHILSMS_API_TOKEN=${{ secrets.PHILSMS_API_TOKEN }}
            PHILSMS_SENDER_ID=${{ secrets.PHILSMS_SENDER_ID }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            PAYMONGO_SECRET_KEY=${{ secrets.PAYMONGO_SECRET_KEY }}
            PAYMONGO_WEBHOOK_AUTH=${{ secrets.PAYMONGO_WEBHOOK_AUTH }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            ENVEOF

            for key in \
              POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB BACKEND_PORT FRONTEND_URL DATABASE_URL JWT_SECRET \
              GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL \
              PHILSMS_API_URL PHILSMS_API_TOKEN PHILSMS_SENDER_ID \
              GMAIL_USER GMAIL_APP_PASSWORD PAYMONGO_SECRET_KEY PAYMONGO_WEBHOOK_AUTH \
              VITE_API_URL VITE_GOOGLE_CLIENT_ID; do
              value=$(grep -E "^${key}=" .env | head -n1 | cut -d'=' -f2-)
              if [ -z "$value" ]; then
                echo "Generated .env has missing or empty key: $key"
                exit 1
              fi
            done

            echo "Validating compose configuration..."
            docker compose --env-file .env config
            docker compose --env-file .env down || true
            docker compose --env-file .env up -d --build --remove-orphans --force-recreate
            sleep 3
            echo "Current container status:"
            docker compose --env-file .env ps -a
            echo "Matching containers on host:"
            docker ps -a --filter "name=visa-reminder" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            echo "Validating env injection inside containers (masked):"
            docker inspect visa-reminder-backend --format '{{range .Config.Env}}{{println .}}{{end}}' | \
              grep -E '^(GOOGLE_CLIENT_ID|GOOGLE_CLIENT_SECRET|GOOGLE_CALLBACK_URL|JWT_SECRET|FRONTEND_URL|DATABASE_URL|PHILSMS_API_TOKEN|PAYMONGO_SECRET_KEY)=' | \
              sed -E 's/^([^=]+)=.*$/\1=SET/'
            docker inspect visa-reminder-frontend --format '{{range .Config.Env}}{{println .}}{{end}}' | \
              grep -E '^(VITE_API_URL|VITE_GOOGLE_CLIENT_ID)=' | \
              sed -E 's/^([^=]+)=.*$/\1=SET/'
            echo "Recent container logs:"
            docker compose --env-file .env logs --tail=50
          EOF
