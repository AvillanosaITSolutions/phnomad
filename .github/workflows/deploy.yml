name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy app stack to VPS
        env:
          VPS_HOST: 88.222.245.88
          VPS_USER: root
        run: |
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} << 'EOF'
            set -e

            REPO_URL="https://github.com/Kim-Avillanosa/phnomad.git"
            APP_DIR="/phnomad"

            if [ ! -d "${APP_DIR}/.git" ]; then
              git clone "${REPO_URL}" "${APP_DIR}"
            else
              cd "${APP_DIR}"
              git fetch origin
              git checkout -f main
              git pull origin main
            fi

            cd "${APP_DIR}"

            cat > .env << 'ENVEOF'
            POSTGRES_USER=${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB=${{ secrets.POSTGRES_DB }}
            BACKEND_PORT=${{ secrets.BACKEND_PORT }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
            ADMIN_EMAILS=${{ secrets.ADMIN_EMAILS }}
            PHILSMS_API_URL=${{ secrets.PHILSMS_API_URL }}
            PHILSMS_API_TOKEN=${{ secrets.PHILSMS_API_TOKEN }}
            PHILSMS_SENDER_ID=${{ secrets.PHILSMS_SENDER_ID }}
            GMAIL_USER=${{ secrets.GMAIL_USER }}
            GMAIL_APP_PASSWORD=${{ secrets.GMAIL_APP_PASSWORD }}
            PAYMONGO_SECRET_KEY=${{ secrets.PAYMONGO_SECRET_KEY }}
            PAYMONGO_WEBHOOK_AUTH=${{ secrets.PAYMONGO_WEBHOOK_AUTH }}
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            ENVEOF

            docker compose down || true
            docker compose up -d --build
          EOF
