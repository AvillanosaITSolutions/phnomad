name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Validate SSH configuration
        env:
          VPS_HOST: 88.222.245.88
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          USERNAME="${VPS_USER:-root}"
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "VPS_SSH_KEY secret is empty or missing."
            exit 1
          fi
          echo "Using SSH target ${USERNAME}@${VPS_HOST}:${PORT}"
          ssh-add -l || true

      - name: Validate required app secrets
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          WWW_DOMAIN: ${{ secrets.WWW_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          PHILSMS_API_URL: ${{ secrets.PHILSMS_API_URL }}
          PHILSMS_API_TOKEN: ${{ secrets.PHILSMS_API_TOKEN }}
          PHILSMS_SENDER_ID: ${{ secrets.PHILSMS_SENDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY }}
          PAYMONGO_WEBHOOK_AUTH: ${{ secrets.PAYMONGO_WEBHOOK_AUTH }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          SKIP_HEALTHCHECKS: ${{ secrets.SKIP_HEALTHCHECKS }}
        run: |
          set -e
          missing=0
          for key in \
            ACME_EMAIL APP_DOMAIN WWW_DOMAIN API_DOMAIN \
            POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB BACKEND_PORT FRONTEND_URL DATABASE_URL JWT_SECRET \
            GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL \
            PHILSMS_API_URL PHILSMS_API_TOKEN PHILSMS_SENDER_ID \
            GMAIL_USER GMAIL_APP_PASSWORD PAYMONGO_SECRET_KEY PAYMONGO_WEBHOOK_AUTH \
            VITE_API_URL VITE_GOOGLE_CLIENT_ID; do
            value="${!key}"
            if [ -z "$value" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing. Aborting deploy."
            exit 1
          fi

      - name: Check SSH reachability
        env:
          VPS_HOST: 88.222.245.88
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          timeout 20 bash -c "cat < /dev/null > /dev/tcp/${VPS_HOST}/${PORT}" || {
            echo "Cannot reach ${VPS_HOST}:${PORT} from GitHub runner."
            echo "Open the port in VPS cloud firewall/security group and UFW/iptables."
            exit 1
          }

      - name: Generate deployment env file
        env:
          ACME_EMAIL: ${{ secrets.ACME_EMAIL }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          WWW_DOMAIN: ${{ secrets.WWW_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          BACKEND_PORT: ${{ secrets.BACKEND_PORT }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL: ${{ secrets.GOOGLE_CALLBACK_URL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          PHILSMS_API_URL: ${{ secrets.PHILSMS_API_URL }}
          PHILSMS_API_TOKEN: ${{ secrets.PHILSMS_API_TOKEN }}
          PHILSMS_SENDER_ID: ${{ secrets.PHILSMS_SENDER_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PAYMONGO_SECRET_KEY: ${{ secrets.PAYMONGO_SECRET_KEY }}
          PAYMONGO_WEBHOOK_AUTH: ${{ secrets.PAYMONGO_WEBHOOK_AUTH }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          normalize_domain() {
            local raw="$1"
            local clean
            clean=$(printf '%s' "$raw" | tr -d '[:space:]')
            clean="${clean#\"}"
            clean="${clean%\"}"
            clean="${clean#\'}"
            clean="${clean%\'}"
            clean="${clean#http://}"
            clean="${clean#https://}"
            clean="${clean%%/*}"
            clean="${clean%%\?*}"
            clean="${clean%%\#*}"
            clean="${clean%%:*}"
            printf '%s' "$clean" | tr '[:upper:]' '[:lower:]'
          }

          APP_DOMAIN_CLEAN="$(normalize_domain "$APP_DOMAIN")"
          WWW_DOMAIN_CLEAN="$(normalize_domain "$WWW_DOMAIN")"
          API_DOMAIN_CLEAN="$(normalize_domain "$API_DOMAIN")"

          if [ -z "$APP_DOMAIN_CLEAN" ] || [ -z "$WWW_DOMAIN_CLEAN" ] || [ -z "$API_DOMAIN_CLEAN" ]; then
            echo "One or more domain secrets are invalid after normalization."
            echo "APP_DOMAIN='$APP_DOMAIN_CLEAN' WWW_DOMAIN='$WWW_DOMAIN_CLEAN' API_DOMAIN='$API_DOMAIN_CLEAN'"
            exit 1
          fi

          echo "Normalized domains: APP_DOMAIN=${APP_DOMAIN_CLEAN} WWW_DOMAIN=${WWW_DOMAIN_CLEAN} API_DOMAIN=${API_DOMAIN_CLEAN}"

          cat > .env.deploy <<EOF
          ACME_EMAIL=${ACME_EMAIL}
          APP_DOMAIN=${APP_DOMAIN_CLEAN}
          WWW_DOMAIN=${WWW_DOMAIN_CLEAN}
          API_DOMAIN=${API_DOMAIN_CLEAN}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          BACKEND_PORT=${BACKEND_PORT}
          ENABLE_HTTPS=false
          FRONTEND_URL=${FRONTEND_URL}
          DATABASE_URL=${DATABASE_URL}
          JWT_SECRET=${JWT_SECRET}
          GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
          GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
          GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
          ADMIN_EMAILS=${ADMIN_EMAILS}
          PHILSMS_API_URL=${PHILSMS_API_URL}
          PHILSMS_API_TOKEN=${PHILSMS_API_TOKEN}
          PHILSMS_SENDER_ID=${PHILSMS_SENDER_ID}
          GMAIL_USER=${GMAIL_USER}
          GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
          PAYMONGO_SECRET_KEY=${PAYMONGO_SECRET_KEY}
          PAYMONGO_WEBHOOK_AUTH=${PAYMONGO_WEBHOOK_AUTH}
          VITE_API_URL=${VITE_API_URL}
          VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
          VITE_DEV_HTTPS=false
          SKIP_HEALTHCHECKS=${SKIP_HEALTHCHECKS:-true}
          EOF

      - name: Sync repository to VPS
        env:
          VPS_HOST: 88.222.245.88
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          set -e
          PORT="${VPS_PORT:-22}"
          USERNAME="${VPS_USER:-root}"
          APP_DIR="/root/phnomad"
          ssh -p "${PORT}" -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${USERNAME}@${VPS_HOST} "mkdir -p ${APP_DIR}"
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            --exclude 'backend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/dist' \
            --exclude '.env' \
            --exclude '.env.vps' \
            -e "ssh -p ${PORT} -o StrictHostKeyChecking=no" \
            ./ "${USERNAME}@${VPS_HOST}:${APP_DIR}/"

      - name: Deploy app stack to VPS
        env:
          VPS_HOST: 88.222.245.88
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          USERNAME="${VPS_USER:-root}"
          ssh -p "${PORT}" -o BatchMode=yes -o PreferredAuthentications=publickey -o StrictHostKeyChecking=no -o ConnectTimeout=20 ${USERNAME}@${VPS_HOST} << 'EOF'
            set -e
            APP_DIR="/root/phnomad"

            echo "Running on host: $(hostname)"
            echo "Current user: $(whoami)"
            echo "App directory: ${APP_DIR}"

            cd "${APP_DIR}"
            test -f docker-compose.yml
            test -f .env.deploy
            mv .env.deploy .env

            for key in \
              ACME_EMAIL APP_DOMAIN API_DOMAIN \
              POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB BACKEND_PORT FRONTEND_URL DATABASE_URL JWT_SECRET \
              GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL \
              PHILSMS_API_URL PHILSMS_API_TOKEN PHILSMS_SENDER_ID \
              GMAIL_USER GMAIL_APP_PASSWORD PAYMONGO_SECRET_KEY PAYMONGO_WEBHOOK_AUTH \
              VITE_API_URL VITE_GOOGLE_CLIENT_ID; do
              value=$(grep -E "^${key}=" .env | head -n1 | cut -d'=' -f2-)
              if [ -z "$value" ]; then
                echo "Generated .env has missing or empty key: $key"
                exit 1
              fi
            done

            echo "Validating compose configuration..."
            docker compose --env-file .env config

            echo "Stopping existing stack before port checks..."
            docker compose --env-file .env down || true

            echo "Releasing ports 80/443 for Traefik..."
            for svc in nginx apache2 caddy; do
              if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet "$svc"; then
                echo "Stopping host service: $svc"
                systemctl stop "$svc" || true
              fi
            done

            conflict_ids=$(printf "%s\n%s\n" "$(docker ps -q --filter publish=80)" "$(docker ps -q --filter publish=443)" | sort -u | sed '/^$/d')
            if [ -n "$conflict_ids" ]; then
              echo "Stopping containers using 80/443: $conflict_ids"
              echo "$conflict_ids" | xargs -r docker rm -f
            fi

            if ss -ltnp '( sport = :80 or sport = :443 )' | grep -E ':80 |:443 ' >/dev/null; then
              echo "Ports still occupied after container cleanup. Attempting one more docker publisher sweep..."
              docker ps --format 'table {{.ID}}\t{{.Names}}\t{{.Ports}}'
              conflict_ids=$(docker ps --format '{{.ID}} {{.Ports}}' | awk '$0 ~ /:80->|:443->/ {print $1}' | sort -u)
              if [ -n "$conflict_ids" ]; then
                echo "$conflict_ids" | xargs -r docker rm -f
              fi
            fi

            if ss -ltn '( sport = :80 or sport = :443 )' | grep -E ':80 |:443 ' >/dev/null; then
              echo "Ports 80/443 are still occupied."
              ss -ltnp '( sport = :80 or sport = :443 )' || true
              exit 1
            fi

            docker compose --env-file .env up -d --build --remove-orphans --force-recreate
            echo "Current container status:"
            docker compose --env-file .env ps -a
            echo "Matching containers on host:"
            docker ps -a --filter "name=visa-reminder" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            docker ps -a --filter "name=visa-reminder-traefik" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}'
            traefik_logs=$(docker compose --env-file .env logs --tail=200 traefik || true)
            if echo "$traefik_logs" | grep -qi 'client version .* too old\|minimum supported API version'; then
              echo "Traefik cannot talk to Docker due to API version mismatch."
              echo "$traefik_logs"
              exit 1
            fi
            echo "Validating env injection inside containers (masked):"
            backend_env=$(docker inspect visa-reminder-backend --format '{{range .Config.Env}}{{println .}}{{end}}')
            frontend_env=$(docker inspect visa-reminder-frontend --format '{{range .Config.Env}}{{println .}}{{end}}')

            for key in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_CALLBACK_URL JWT_SECRET FRONTEND_URL DATABASE_URL PHILSMS_API_TOKEN PAYMONGO_SECRET_KEY; do
              echo "$backend_env" | grep -q "^${key}=" || { echo "Missing backend runtime env: ${key}"; exit 1; }
              value=$(echo "$backend_env" | grep -E "^${key}=" | head -n1 | cut -d'=' -f2-)
              [ -n "$value" ] || { echo "Empty backend runtime env: ${key}"; exit 1; }
              echo "${key}=SET"
            done

            for key in VITE_API_URL VITE_GOOGLE_CLIENT_ID; do
              echo "$frontend_env" | grep -q "^${key}=" || { echo "Missing frontend runtime env: ${key}"; exit 1; }
              value=$(echo "$frontend_env" | grep -E "^${key}=" | head -n1 | cut -d'=' -f2-)
              [ -n "$value" ] || { echo "Empty frontend runtime env: ${key}"; exit 1; }
              echo "${key}=SET"
            done

            # Guardrails against fallback defaults accidentally reaching production.
            backend_frontend_url=$(echo "$backend_env" | grep -E '^FRONTEND_URL=' | head -n1 | cut -d'=' -f2-)
            backend_callback_url=$(echo "$backend_env" | grep -E '^GOOGLE_CALLBACK_URL=' | head -n1 | cut -d'=' -f2-)
            backend_jwt_secret=$(echo "$backend_env" | grep -E '^JWT_SECRET=' | head -n1 | cut -d'=' -f2-)
            frontend_api_url=$(echo "$frontend_env" | grep -E '^VITE_API_URL=' | head -n1 | cut -d'=' -f2-)

            [ "$backend_frontend_url" != "https://localhost:5173" ] || { echo "FRONTEND_URL is still localhost fallback"; exit 1; }
            [ "$backend_callback_url" != "https://localhost:3000/auth/google/callback" ] || { echo "GOOGLE_CALLBACK_URL is still localhost fallback"; exit 1; }
            [ "$backend_jwt_secret" != "replace-with-a-strong-secret" ] || { echo "JWT_SECRET is still default fallback"; exit 1; }
            [ "$frontend_api_url" != "https://localhost:3000" ] || { echo "VITE_API_URL is still localhost fallback"; exit 1; }

            echo "Running post-deploy readiness checks on VPS..."

            skip_healthchecks=$(grep -E '^SKIP_HEALTHCHECKS=' .env | head -n1 | cut -d'=' -f2- | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')
            if [ -z "$skip_healthchecks" ]; then
              skip_healthchecks=true
            fi

            if [ "$skip_healthchecks" = "true" ]; then
              echo "SKIP_HEALTHCHECKS=true, skipping HTTP/HTTPS readiness checks."
              echo "Recent container logs:"
              docker compose --env-file .env logs --tail=50
              exit 0
            fi

            wait_for_http() {
              local name="$1"
              local url="$2"
              local accepted_codes="$3"
              local host_header="${4:-}"
              local attempts="${5:-30}"
              local delay="${6:-2}"

              local code
              local i
              for i in $(seq 1 "$attempts"); do
                if [ -n "$host_header" ]; then
                  code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Host: ${host_header}" "$url" || true)
                else
                  code=$(curl -sS -o /dev/null -w '%{http_code}' "$url" || true)
                fi

                for ok in $accepted_codes; do
                  if [ "$code" = "$ok" ]; then
                    echo "$name reachable (HTTP $code)"
                    return 0
                  fi
                done

                echo "[$i/$attempts] Waiting for $name (last HTTP code: ${code:-n/a})"
                sleep "$delay"
              done

              echo "$name is not ready after ${attempts} attempts"
              return 1
            }

            wait_for_https() {
              local name="$1"
              local domain="$2"
              local path="$3"
              local accepted_codes="$4"
              local attempts="${5:-30}"
              local delay="${6:-2}"

              local code
              local i
              for i in $(seq 1 "$attempts"); do
                code=$(curl -sS -o /dev/null -w '%{http_code}' --resolve "${domain}:443:127.0.0.1" "https://${domain}${path}" || true)

                for ok in $accepted_codes; do
                  if [ "$code" = "$ok" ]; then
                    echo "$name reachable with valid TLS (HTTP $code)"
                    return 0
                  fi
                done

                echo "[$i/$attempts] Waiting for $name over HTTPS (last HTTP code: ${code:-n/a})"
                sleep "$delay"
              done

              echo "$name HTTPS is not ready after ${attempts} attempts"
              return 1
            }

            dump_traefik_diagnostics() {
              echo "--- Traefik diagnostics ---"
              docker compose --env-file .env ps traefik || true
              docker compose --env-file .env logs --tail=120 traefik || true
              docker exec visa-reminder-traefik sh -lc 'ls -l /letsencrypt || true; test -f /letsencrypt/acme.json && wc -c /letsencrypt/acme.json || true' || true
              echo "---------------------------"
            }

            dump_tls_diagnostics() {
              local domain="$1"
              echo "--- TLS diagnostics for ${domain} ---"
              echo "Public DNS A records:"
              getent ahostsv4 "$domain" || true
              echo "Local HTTPS probe (SNI + resolve to 127.0.0.1):"
              curl -vkI --resolve "${domain}:443:127.0.0.1" "https://${domain}/" 2>&1 | tail -n 40 || true
              echo "Certificate presented by Traefik on 127.0.0.1:443 for SNI=${domain}:"
              echo | openssl s_client -servername "$domain" -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -subject -issuer -dates -ext subjectAltName || true
              echo "ACME file preview (/letsencrypt/acme.json):"
              docker exec visa-reminder-traefik sh -lc 'if [ -f /letsencrypt/acme.json ]; then sed -n "1,80p" /letsencrypt/acme.json; else echo "acme.json missing"; fi' || true
              echo "-------------------------------------"
            }

            dump_service_diagnostics() {
              local service="$1"
              local container="$2"
              echo "--- Diagnostics for ${service} (${container}) ---"
              docker compose --env-file .env ps "$service" || true
              docker ps -a --filter "name=${container}" --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
              docker compose --env-file .env logs --tail=200 "$service" || true
              docker inspect "$container" --format '{{json .State}}' || true
              echo "-----------------------------------------------"
            }

            app_domain=$(grep -E '^APP_DOMAIN=' .env | head -n1 | cut -d'=' -f2-)
            www_domain=$(grep -E '^WWW_DOMAIN=' .env | head -n1 | cut -d'=' -f2-)
            api_domain=$(grep -E '^API_DOMAIN=' .env | head -n1 | cut -d'=' -f2-)

            wait_for_http "Backend container" "http://127.0.0.1:3000/auth/me" "200 204 301 302 401 403" || { echo "Backend HTTP endpoint is not reachable"; dump_service_diagnostics backend visa-reminder-backend; exit 1; }
            wait_for_http "Frontend container" "http://127.0.0.1:5173" "200 204 301 302" || { echo "Frontend HTTP endpoint is not reachable"; dump_service_diagnostics frontend visa-reminder-frontend; exit 1; }
            wait_for_http "Traefik web route" "http://127.0.0.1" "200 301 302 307 308" "$app_domain" || { echo "Traefik HTTP web route is not reachable"; dump_traefik_diagnostics; exit 1; }
            wait_for_http "Traefik web route (www)" "http://127.0.0.1" "200 301 302 307 308" "$www_domain" || { echo "Traefik HTTP web route (www) is not reachable"; dump_traefik_diagnostics; exit 1; }
            wait_for_http "Traefik API route" "http://127.0.0.1/auth/me" "200 204 301 302 401 403" "$api_domain" || { echo "Traefik API route is not reachable"; dump_traefik_diagnostics; exit 1; }

            wait_for_https "Primary domain" "$app_domain" "/" "200 301 302 307 308" 40 3 || { echo "Primary domain TLS check failed"; dump_traefik_diagnostics; dump_tls_diagnostics "$app_domain"; exit 1; }
            wait_for_https "WWW domain" "$www_domain" "/" "200 301 302 307 308" 40 3 || { echo "WWW domain TLS check failed"; dump_traefik_diagnostics; dump_tls_diagnostics "$www_domain"; exit 1; }
            wait_for_https "API domain" "$api_domain" "/auth/me" "200 204 301 302 307 308 401 403" 40 3 || { echo "API domain TLS check failed"; dump_traefik_diagnostics; dump_tls_diagnostics "$api_domain"; exit 1; }

            echo "Recent container logs:"
            docker compose --env-file .env logs --tail=50
          EOF
